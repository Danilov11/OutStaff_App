<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Администрирование — Платформа Аутстафф</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ── Admin overrides ── */
    body { background: var(--canvas); }

    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--bdr-line);
      border-radius: var(--r-lg);
      padding: 40px 48px;
      width: 380px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .login-card .brand { font-size: 22px; font-weight: 700; color: var(--teal); margin-bottom: 4px; }
    .login-card .sub  { font-size: 13px; color: var(--tx2); margin-bottom: 28px; }
    .login-card .inp  {
      width: 100%; padding: 10px 14px; border: 1px solid var(--bdr-mid);
      border-radius: var(--r-sm); font-size: 15px; margin-bottom: 12px;
      box-sizing: border-box; outline: none; font-family: inherit;
    }
    .login-card .inp:focus { border-color: var(--teal); }
    .login-card .err { color: var(--er-fg); font-size: 13px; margin-top: 6px; display: none; }

    /* Layout */
    .adm-header {
      background: var(--teal);
      color: var(--on-teal);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .adm-header .brand { font-weight: 700; font-size: 16px; }
    .adm-header .badge {
      background: rgba(255,255,255,.15);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
    }
    .adm-header .logout {
      margin-left: auto;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: var(--on-teal);
      padding: 6px 14px;
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 13px;
    }
    .adm-header .logout:hover { background: rgba(255,255,255,.2); }

    .adm-body { max-width: 960px; margin: 32px auto; padding: 0 24px; }

    /* Tabs */
    .adm-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid var(--bdr-line); }
    .adm-tab {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--tx2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--dur);
    }
    .adm-tab.active { color: var(--teal); border-bottom-color: var(--teal); }
    .adm-tab:hover:not(.active) { color: var(--tx); }

    .adm-panel { display: none; }
    .adm-panel.active { display: block; }

    /* Card */
    .adm-card {
      background: var(--surface);
      border: 1px solid var(--bdr-line);
      border-radius: var(--r-lg);
      padding: 28px 32px;
      margin-bottom: 20px;
    }
    .adm-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--tx); }

    /* Steps */
    .steps { display: flex; align-items: center; gap: 0; margin-bottom: 28px; }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--tx3);
      flex: 1;
    }
    .step.active { color: var(--teal); font-weight: 600; }
    .step.done { color: var(--ok-fg); }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--muted-band);
      color: var(--tx2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .step.active .step-num { background: var(--teal); color: #fff; }
    .step.done .step-num { background: var(--ok-bg); color: var(--ok-fg); }
    .step-line { flex: 1; height: 2px; background: var(--bdr-line); margin: 0 8px; }
    .step-line.done { background: var(--ok-fg); }

    /* Form elements */
    .form-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--tx2); text-transform: uppercase; letter-spacing: .4px; }
    .form-group select,
    .form-group input[type="text"],
    .form-group input[type="number"] {
      padding: 9px 12px;
      border: 1px solid var(--bdr-mid);
      border-radius: var(--r-sm);
      font-size: 14px;
      font-family: inherit;
      color: var(--tx);
      outline: none;
      background: var(--surface);
    }
    .form-group select:focus,
    .form-group input:focus { border-color: var(--teal); }

    /* File drop zone */
    .dropzone {
      border: 2px dashed var(--bdr-mid);
      border-radius: var(--r-lg);
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: all var(--dur);
      background: var(--canvas);
    }
    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--teal);
      background: var(--teal-subtle);
    }
    .dropzone i { font-size: 36px; color: var(--tx3); margin-bottom: 12px; display: block; }
    .dropzone .dz-title { font-size: 15px; font-weight: 600; color: var(--tx); margin-bottom: 4px; }
    .dropzone .dz-sub { font-size: 13px; color: var(--tx2); }
    .dropzone.has-file { border-color: var(--ok-fg); background: var(--ok-bg); }
    .dropzone.has-file i { color: var(--ok-fg); }

    /* Column mapper */
    .col-mapper { width: 100%; border-collapse: collapse; font-size: 13px; }
    .col-mapper th {
      background: var(--muted-band);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--tx2);
    }
    .col-mapper td { padding: 8px 12px; border-bottom: 1px solid var(--bdr-line); }
    .col-mapper tr:last-child td { border-bottom: none; }
    .col-mapper .col-name { font-weight: 600; color: var(--tx); }
    .col-mapper .col-sample { color: var(--tx2); font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-mapper select {
      padding: 6px 10px;
      border: 1px solid var(--bdr-mid);
      border-radius: var(--r-sm);
      font-size: 13px;
      font-family: inherit;
      min-width: 200px;
      outline: none;
    }
    .col-mapper select:focus { border-color: var(--teal); }

    /* Preview table */
    .preview-wrap { overflow-x: auto; border-radius: var(--r-sm); border: 1px solid var(--bdr-line); }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .preview-table th {
      background: var(--teal);
      color: #fff;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }
    .preview-table td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--bdr-line);
      color: var(--tx);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-table tr:last-child td { border-bottom: none; }
    .preview-table tr:nth-child(even) td { background: var(--canvas); }

    /* Progress */
    .import-progress { display: none; }
    .prog-bar-wrap { background: var(--muted-band); border-radius: var(--r-pill); height: 8px; margin: 12px 0; overflow: hidden; }
    .prog-bar { height: 100%; background: var(--teal); border-radius: var(--r-pill); transition: width .3s; width: 0%; }
    .prog-log { max-height: 200px; overflow-y: auto; font-size: 12px; color: var(--tx2); padding: 8px 0; }
    .prog-log .log-line { padding: 2px 0; }
    .prog-log .log-ok  { color: var(--ok-fg); }
    .prog-log .log-err { color: var(--er-fg); }

    /* Restaurant list */
    .rest-list { display: flex; flex-direction: column; gap: 8px; }
    .rest-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--bdr-line);
      border-radius: var(--r-md);
      background: var(--surface);
    }
    .rest-item .rest-icon {
      width: 36px; height: 36px;
      background: var(--teal-subtle);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal); font-size: 16px; flex-shrink: 0;
    }
    .rest-item .rest-name { font-weight: 600; color: var(--tx); }
    .rest-item .rest-id { font-size: 11px; color: var(--tx3); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all var(--dur); }
    .btn-primary { background: var(--teal); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--teal-h); }
    .btn-secondary { background: var(--surface); color: var(--tx); border: 1px solid var(--bdr-mid); }
    .btn-secondary:hover:not(:disabled) { background: var(--canvas); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-row { display: flex; gap: 10px; align-items: center; margin-top: 20px; }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: var(--r-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert.show { display: flex; align-items: center; gap: 10px; }
    .alert-ok  { background: var(--ok-bg);  color: var(--ok-fg);  border: 1px solid var(--ok-br); }
    .alert-err { background: var(--er-bg);  color: var(--er-fg);  border: 1px solid var(--er-br); }
    .alert-info { background: var(--in-bg); color: var(--in-fg);  border: 1px solid var(--in-br); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="brand">Платформа Аутстафф</div>
    <div class="sub">Панель администратора</div>
    <input type="text" class="inp" id="login-username" placeholder="Логин" autocomplete="username" />
    <input type="password" class="inp" id="login-password" placeholder="Пароль" autocomplete="current-password" />
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Войти</button>
    <div class="err" id="login-err">Неверный логин или пароль</div>
  </div>
</div>

<!-- ═══════════════ ADMIN APP ═══════════════ -->
<div id="admin-app" class="hidden">

  <div class="adm-header">
    <span class="brand">Платформа Аутстафф</span>
    <span class="badge">Администратор</span>
    <button class="logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Выйти</button>
  </div>

  <div class="adm-body">
    <div id="admin-screen"></div>
  </div>

</div><!-- /admin-app -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
